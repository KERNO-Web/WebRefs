name: Deploy sites to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build every project into _site/<name>
        run: |
          mkdir -p _site
          echo "::group::homepage"
          (cd _landing && npm ci --ignore-scripts --no-audit --no-fund && npx vite build)
          cp -R _landing/dist/. _site/
          echo "::endgroup::"
          for p in afterimage key01 noctis null witcher ranked nexus route brightline kvit; do
            echo "::group::$p"
            (cd "$p" && npm ci --ignore-scripts --no-audit --no-fund && npx vite build)
            cp -R "$p/dist" "_site/$p"
            echo "::endgroup::"
          done
          # Esports Pro: Next.js + Postgres app, committed as a prebuilt static snapshot.
          cp -R esports "_site/esports"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
