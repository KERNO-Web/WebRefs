name: Deploy sites to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build every project into _site/<name>
        run: |
          mkdir -p _site
          cp _landing/index.html _landing/og.jpg _site/
          for p in noctis null witcher ranked nexus route; do
            echo "::group::$p"
            (cd "$p" && npm ci --ignore-scripts --no-audit --no-fund && npx vite build)
            cp -R "$p/dist" "_site/$p"
            echo "::endgroup::"
          done
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
