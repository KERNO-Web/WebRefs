<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Geek Radar: a pixel invader caught in the rings of a radar, neon on deep indigo -->
  <defs>
    <radialGradient id="bg" cx="50%" cy="44%" r="64%">
      <stop offset="0" stop-color="#3a1a6e" />
      <stop offset="0.62" stop-color="#1c0f38" />
      <stop offset="1" stop-color="#100822" />
    </radialGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#c6ff4f" stop-opacity="0.45" />
      <stop offset="1" stop-color="#c6ff4f" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="sweep" x1="256" y1="60" x2="452" y2="256" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ff4fa3" stop-opacity="0" />
      <stop offset="1" stop-color="#ff4fa3" stop-opacity="0.42" />
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#bg)" />
  <g fill="none" stroke="#ff4fa3">
    <circle cx="256" cy="256" r="200" stroke-opacity="0.3" stroke-width="3" />
    <circle cx="256" cy="256" r="142" stroke-opacity="0.38" stroke-width="3" />
    <path d="M256 48V464M48 256H464" stroke-opacity="0.14" stroke-width="2" />
  </g>
  <!-- the beam turns clockwise; its wedge trails behind it -->
  <path d="M256 256 L256 56 A200 200 0 0 1 456 256 Z" fill="url(#sweep)" />
  <path d="M256 256 L456 256" stroke="#ff8cc4" stroke-width="5" stroke-linecap="round" />
  <circle cx="256" cy="262" r="118" fill="url(#halo)" />
  <!-- the invader, on a 11×8 grid of 20 px cells -->
  <g fill="#c6ff4f" transform="translate(146 182)">
    <rect x="40" y="0" width="20" height="20" /><rect x="160" y="0" width="20" height="20" />
    <rect x="60" y="20" width="20" height="20" /><rect x="140" y="20" width="20" height="20" />
    <rect x="40" y="40" width="140" height="20" />
    <rect x="20" y="60" width="40" height="20" /><rect x="80" y="60" width="60" height="20" /><rect x="160" y="60" width="40" height="20" />
    <rect x="0" y="80" width="220" height="20" />
    <rect x="0" y="100" width="20" height="20" /><rect x="40" y="100" width="140" height="20" /><rect x="200" y="100" width="20" height="20" />
    <rect x="0" y="120" width="20" height="20" /><rect x="40" y="120" width="20" height="20" /><rect x="160" y="120" width="20" height="20" /><rect x="200" y="120" width="20" height="20" />
    <rect x="60" y="140" width="40" height="20" /><rect x="120" y="140" width="40" height="20" />
  </g>
  <circle cx="404" cy="150" r="9" fill="#ff8cc4" />
  <circle cx="132" cy="384" r="6" fill="#ff4fa3" fill-opacity="0.6" />
</svg>
