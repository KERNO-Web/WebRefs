<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Geek Radar: a flat two-colour sticker — a pixel invader with a radar dish
       for an antenna, picking up a signal. -->
  <rect width="512" height="512" fill="#ffd400" />
  <g fill="#141414">
    <!-- the dish on its mast, rising from the invader's head, and the signal it hears -->
    <path d="M256 262 L290 150" stroke="#141414" stroke-width="13" stroke-linecap="round" />
    <path d="M258 116 A44 44 0 0 0 322 180 Z" />
    <path d="M290 148 L322 116" stroke="#141414" stroke-width="7" stroke-linecap="round" />
    <circle cx="324" cy="114" r="9" />
    <path d="M346 92 a40 40 0 0 1 22 22" fill="none" stroke="#141414" stroke-width="12" stroke-linecap="round" />
    <path d="M356 60 a72 72 0 0 1 44 44" fill="none" stroke="#141414" stroke-width="12" stroke-linecap="round" />
    <!-- the invader, on an 11×8 grid of 22 px cells -->
    <g transform="translate(135 212)">
      <rect x="44" y="0" width="22" height="22" /><rect x="176" y="0" width="22" height="22" />
      <rect x="66" y="22" width="22" height="22" /><rect x="154" y="22" width="22" height="22" />
      <rect x="44" y="44" width="154" height="22" />
      <rect x="22" y="66" width="44" height="22" /><rect x="88" y="66" width="66" height="22" /><rect x="176" y="66" width="44" height="22" />
      <rect x="0" y="88" width="242" height="22" />
      <rect x="0" y="110" width="22" height="22" /><rect x="44" y="110" width="154" height="22" /><rect x="220" y="110" width="22" height="22" />
      <rect x="0" y="132" width="22" height="22" /><rect x="44" y="132" width="22" height="22" /><rect x="176" y="132" width="22" height="22" /><rect x="220" y="132" width="22" height="22" />
      <rect x="66" y="154" width="44" height="22" /><rect x="132" y="154" width="44" height="22" />
    </g>
  </g>
</svg>
