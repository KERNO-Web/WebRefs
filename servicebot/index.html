<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Отвёртка · Telegram-бот сервиса</title>
  <meta name="description" content="Демо KERNØ: Telegram-бот сервисного центра. Клиент сдаёт технику в ремонт и получает статусы, мастер ведёт заявки в панели, оплата и рассылка в одном месте." />
  <meta property="og:title" content="Отвёртка · Telegram-бот для сервиса и мастерской" />
  <meta property="og:image" content="og.jpg" />
  <meta name="theme-color" content="#e9edf2" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#0e1116" media="(prefers-color-scheme: dark)" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css" />
  <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="top">
    <a class="back" href="../" aria-label="Все работы KERNØ"><i class="ph ph-arrow-left"></i></a>
    <div class="brand"><span class="logo"><i class="ph-fill ph-screwdriver"></i></span><div><b>Отвёртка</b><small>Telegram-бот сервисного центра</small></div></div>
    <div class="switch" role="tablist" aria-label="Чья сторона">
      <button role="tab" aria-selected="true" data-side="client">Клиент<i class="dot" id="dotClient"></i></button>
      <button role="tab" aria-selected="false" data-side="admin">Мастер<i class="dot" id="dotAdmin"></i></button>
    </div>
    <button class="reset" id="reset" aria-label="Начать заново"><i class="ph ph-arrow-counter-clockwise"></i><span>Заново</span></button>
    <a class="talk" href="https://t.me/Kernodev" target="_blank" rel="noopener">Обсудить проект</a>
  </header>

  <main class="stage" data-side="client">
    <!-- CLIENT: the bot inside a phone -->
    <section class="side-client" aria-label="Чат клиента с ботом">
      <p class="cap">Так видит клиент</p>
      <div class="phone">
        <div class="tg-head">
          <span class="ava"><i class="ph-fill ph-screwdriver"></i></span>
          <div><b>Отвёртка · ремонт</b><small id="tgStatus">бот</small></div>
          <i class="ph ph-dots-three-vertical"></i>
        </div>
        <div class="tg-feed" id="feed" aria-live="polite"></div>
        <div class="tg-kb" id="replyKb"></div>
        <form class="tg-input" id="input" autocomplete="off">
          <button type="button" class="kb-toggle" id="kbToggle" aria-label="Меню бота"><i class="ph ph-squares-four"></i></button>
          <label class="sr" for="msg">Сообщение</label>
          <input id="msg" placeholder="Сообщение" maxlength="300" />
          <button type="submit" class="send" aria-label="Отправить"><i class="ph-fill ph-paper-plane-tilt"></i></button>
        </form>
        <div class="start" id="start">
          <button class="btn" id="startBtn">Запустить бота</button>
        </div>
        <div class="pay" id="pay" hidden></div>
      </div>
    </section>

    <!-- ADMIN: the service panel -->
    <section class="side-admin" aria-label="Панель мастера">
      <p class="cap">Так видит мастер</p>
      <div class="admin">
        <nav class="a-tabs" role="tablist" aria-label="Панель">
          <button role="tab" aria-selected="true" data-tab="orders"><i class="ph ph-wrench"></i>Заявки<em id="newCount"></em></button>
          <button role="tab" aria-selected="false" data-tab="inbox"><i class="ph ph-chats-circle"></i>Вопросы<em id="inboxCount"></em></button>
          <button role="tab" aria-selected="false" data-tab="broadcast"><i class="ph ph-megaphone"></i>Рассылка</button>
        </nav>
        <div class="a-body" id="a-orders"></div>
        <div class="a-body" id="a-inbox" hidden></div>
        <div class="a-body" id="a-broadcast" hidden></div>
      </div>
    </section>
  </main>

  <div class="toasts" id="toasts" aria-live="polite"></div>
  <script type="module" src="app.js"></script>
</body>
</html>
